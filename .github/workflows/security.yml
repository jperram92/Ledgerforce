# LedgerForce security gates (T-0095, ADR-0043 Accepted under DL-0241, RQ-0092).
# A new workflow; ci.yml and install-smoke.yml are unchanged. Scanners are the digest-pinned images
# in infra/security/tools.json, invoked by scripts/security/scan.mjs, which fails closed: a tool,
# download, database, configuration or report error is exit 2, a finding is exit 1.
# Reports are uploaded as ordinary run artifacts only (no SARIF upload, no write token).
# Actions are pinned to full commit SHAs resolved from the upstream tags noted beside them.
name: security

on:
  push:
    branches-ignore: [main] # same as ci.yml: task branches are scanned without needing a PR
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  LF_SECURITY_CACHE: ${{ github.workspace }}/../security-cache

jobs:
  scanner-contracts:
    name: scanners fail on seeded issues (SS-PLAT-18)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node --test tests/security/scanners.contract.test.mjs

  sast:
    name: SAST (Semgrep CE, local rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/security/scan.mjs sast . "$RUNNER_TEMP/security/sast"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-sast
          path: ${{ runner.temp }}/security/sast/
          if-no-files-found: error

  secrets:
    name: secrets (Gitleaks, history + working tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the history scan needs every commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Both scans always run; the step fails if either does. Reports are fully redacted.
      - run: |
          status=0
          node scripts/security/scan.mjs history . "$RUNNER_TEMP/security/history" || status=1
          node scripts/security/scan.mjs secrets . "$RUNNER_TEMP/security/tree" || status=1
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-secrets
          path: ${{ runner.temp }}/security/
          if-no-files-found: error

  dependencies:
    name: dependencies (pnpm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, version from package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Report first (production and dev), so the artifact exists whatever the gate says. A report
      # that is missing or does not parse as an audit result is a tool failure and fails the step.
      - name: audit reports (production and dev)
        run: |
          out="$RUNNER_TEMP/security/audit"; mkdir -p "$out"
          for scope in prod dev; do
            code=0
            if [ "$scope" = prod ]; then pnpm audit --prod --json >"$out/$scope-audit.json" || code=$?
            else pnpm audit --dev --json >"$out/$scope-audit.json" || code=$?; fi
            node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              if (!r.metadata || !r.metadata.vulnerabilities) { console.error("malformed audit report"); process.exit(2); }
              console.log(process.argv[2], "audit:", JSON.stringify(r.metadata.vulnerabilities), "exit", process.argv[3]);' \
              "$out/$scope-audit.json" "$scope" "$code"
          done
      - name: production dependency gate (high and critical)
        run: pnpm audit --prod --audit-level high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-dependencies
          path: ${{ runner.temp }}/security/audit/
          if-no-files-found: error

  images:
    name: image SBOM + vulnerabilities (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [api, worker, setup, web] # every target shipped by infra/docker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # Built and saved for scanning only: never started, never pushed.
      - name: build ${{ matrix.target }} image
        run: |
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/security/${{ matrix.target }}"
          docker build -f infra/docker/Dockerfile --target "${{ matrix.target }}" -t "ledgerforce-${{ matrix.target }}:scan" .
          docker image inspect --format '{{.Id}}' "ledgerforce-${{ matrix.target }}:scan" \
            >"$RUNNER_TEMP/security/${{ matrix.target }}/image-id.txt"
          docker save -o "$RUNNER_TEMP/image/${{ matrix.target }}.tar" "ledgerforce-${{ matrix.target }}:scan"
      - run: node scripts/security/scan.mjs sbom "$RUNNER_TEMP/image/${{ matrix.target }}.tar" "$RUNNER_TEMP/security/${{ matrix.target }}"
      - run: node scripts/security/scan.mjs vulnerabilities "$RUNNER_TEMP/security/${{ matrix.target }}/sbom.cdx.json" "$RUNNER_TEMP/security/${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-image-${{ matrix.target }}
          path: ${{ runner.temp }}/security/${{ matrix.target }}/
          if-no-files-found: error
